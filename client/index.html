<!DOCTYPE html>
<html lang="it" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="description" content="Confronta previsioni astrologiche da fonti autorevoli italiane. Relazioni, Lavoro e Benessere." />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Oroscopo IT">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/npm/@mdi/svg@7.2.96/svg/star.svg">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oroscopo Italiano - Confronta Previsioni" />
    <meta property="og:description" content="La prima piattaforma italiana che confronta previsioni astrologiche da fonti autorevoli italiane." />

    <meta property="og:site_name" content="Oroscopo Italiano" />
    <meta property="og:image" content="https://cdn.jsdelivr.net/npm/@mdi/svg@7.2.96/svg/star.svg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Oroscopo Italiano - Confronta Previsioni" />
    <meta name="twitter:description" content="La prima piattaforma italiana che confronta previsioni astrologiche da fonti autorevoli italiane." />
    <meta name="twitter:image" content="https://cdn.jsdelivr.net/npm/@mdi/svg@7.2.96/svg/star.svg" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://clerk.confrontaoroscopo.it">
    <!-- Inter: non-render-blocking async load, only the 5 weights used -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@mdi/svg@7.2.96/svg/star.svg">
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

  <body class="h-full">
